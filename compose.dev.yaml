# Local development Postgres only. The production stack is deploy/compose.prod.yaml.
# A name of its own, so cleaning up a production-stack test (`down -v`) can never delete this database.
name: dk-publishing-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dk_publishing
    ports: ["5433:5432"]   # 5433 so it never collides with another local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
