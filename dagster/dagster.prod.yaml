# Production: run storage in the separate `dagster` Postgres database (never the `app` one).
telemetry:
  enabled: false
# DAGSTER_DATABASE_URL must start with postgresql+psycopg2:// (see deploy/compose.prod.yaml).
storage:
  postgres:
    postgres_url:
      env: DAGSTER_DATABASE_URL
run_monitoring:
  # A run killed while starting or running (a deploy or restart in the middle of a sync) would
  # stay "starting"/"started" forever and block every later run through the concurrency limits
  # above. Monitoring fails such a run so the queue moves on. Runs are safe to repeat (the sensor
  # and the sync are idempotent), so nothing is resumed.
  enabled: true
  start_timeout_seconds: 180
  poll_interval_seconds: 30
  max_resume_run_attempts: 0
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 8
    tag_concurrency_limits:
      - key: dk/account
        limit: 1
        value:
          applyLimitPerUniqueValue: true
      # Only one Sheet sync at a time, so two runs never write status back over each other.
      - key: dk/sync
        limit: 1
