# THIS FILE REPLACES config/platforms.yaml ON THE SERVER. Set each platform's `mode` here.
# Per-platform lead times, lateness and limits. No secrets.
#
# `mode` is what this deployment does for the platform:
#   off      not registered; approving a variant for it fails loudly
#   dry_run  everything real except the final call, which goes to publishing.dry_run_posts
#   live     the real adapter (facebook, instagram, threads, youtube). Posts really go out.
#   assisted the post is handed to you on Telegram (caption + video) at the slot and you post it
#            yourself. Built for tiktok. Needs Telegram set up (docs/setup/telegram.md).
# The launch plan (ADR 0014) is facebook, instagram, threads, youtube live; tiktok and linkedin
# assisted; x and reddit off. Platforms without a real adapter stay dry_run.
#
# `tab` is the Google Sheet tab for the platform (display name; defaults to the key).
#
# `native_window` marks platforms that can hold a post until the slot [min lead, max lead].
# Native scheduling is not built yet, so dry_run mode ignores it and uses prepare-then-publish.
defaults:
  max_lateness: 2h
  prepare_lead: 30m
platforms:
  facebook:  {tab: Facebook, mode: live, api_version: v25.0, native_window: [10m, 30d], prepare_lead: 5m}
  instagram: {tab: Instagram, mode: live, api_version: v25.0, prepare_lead: 30m, prepared_ttl: 24h, pulls_media_by_url: true}
  threads:   {tab: Threads, mode: live, api_version: v1.0, prepare_lead: 10m, pulls_media_by_url: true}
  youtube:   {tab: YouTube, mode: live, native_window: [15m, 180d], prepare_lead: 5m}
  tiktok:    {tab: TikTok, mode: live}
  linkedin:  {tab: LinkedIn, mode: dry_run}
  x:         {tab: X, mode: off}
  reddit:    {tab: Reddit, mode: off}
