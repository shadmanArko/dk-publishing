[project]
name = "dk-publishing"
version = "0.1.0"
description = "Dhaka Kacchi social publishing pipeline: schedule approved posts to eight platforms."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk_publishing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/dk_publishing/domain", "src/dk_publishing/application"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.importlinter]
root_package = "dk_publishing"

# Imports point inward only. The first layer may import everything below it; nothing
# below may import upward. Dagster, FastAPI and the CLI live in `entrypoints`.
[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "dk_publishing.entrypoints",
    "dk_publishing.composition",
    "dk_publishing.adapters",
    "dk_publishing.application",
    "dk_publishing.domain",
]
